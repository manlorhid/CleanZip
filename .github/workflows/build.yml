name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk CleanZip.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CleanZip-apk
          path: CleanZip.apk
      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: CleanZip (última versión)
          body: APK compilado automáticamente desde la rama main.
          prerelease: false
          make_latest: true
          files: CleanZip.apk
